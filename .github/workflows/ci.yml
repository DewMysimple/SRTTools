name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:versions
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release
      - run: npm run build
      - name: Install synthetic media fixture encoder
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  rust:
    name: Rust on Windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: powershell -NoLogo -NoProfile -File scripts/check-windows-scripts.ps1
      - run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component clippy
      - run: cargo +stable-x86_64-pc-windows-msvc test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo +stable-x86_64-pc-windows-msvc clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: powershell -NoLogo -NoProfile -STA -File scripts/windows-qa-safety.test.ps1
      - run: powershell -NoLogo -NoProfile -STA -File scripts/windows-state-protection.test.ps1
