[package]
name = "subtitle-tools"
version = "0.6.0"
description = "Local subtitle processing toolbox"
authors = ["Subtitle Tools"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "subtitle_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
webview2-com = "0.39"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Globalization", "Win32_UI_Shell", "Win32_System_IO", "Win32_System_Ioctl"] }
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
